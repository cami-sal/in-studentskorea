<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="capBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Rounded Tile Background -->
  <rect width="64" height="64" rx="15" fill="url(#tileBg)" />

  <!-- Cap Skull Base / Headband -->
  <path d="M 21 34 L 21 44 C 21 50, 43 50, 43 44 L 43 34 Z" fill="url(#capBody)" />

  <!-- Cap Diamond Mortarboard Top -->
  <path d="M 32 15 L 56 27 L 32 39 L 8 27 Z" fill="url(#capTop)" />

  <!-- Mortarboard Edge Highlight -->
  <path d="M 8 27 L 32 39 L 56 27" fill="none" stroke="#93c5fd" stroke-width="1.2" opacity="0.6" />

  <!-- Center Button -->
  <circle cx="32" cy="27" r="2.8" fill="#ffffff" />

  <!-- Tassel Cord -->
  <path d="M 32 27 C 43 28, 48 33, 48 42" fill="none" stroke="url(#tasselGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Tassel Ring / Accent -->
  <circle cx="48" cy="42" r="1.8" fill="#fbbf24" />

  <!-- Tassel Fringe -->
  <path d="M 45.5 43.5 L 50.5 43.5 L 50 53 L 46 53 Z" fill="url(#tasselGrad)" />
</svg>
